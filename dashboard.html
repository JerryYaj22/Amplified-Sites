<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <title>Project Dashboard</title>
  <style>
    body {
      font-family: Arial;
      background: #0b0f1a;
      color: white;
      text-align: center;
      padding: 50px;
    }

    input {
      padding: 10px;
      width: 250px;
      border-radius: 5px;
      border: none;
    }

    button {
      padding: 10px 20px;
      margin-left: 10px;
      cursor: pointer;
      border: none;
      background: #2563eb;
      color: white;
      border-radius: 5px;
    }

    .box {
      margin-top: 30px;
      padding: 20px;
      background: #111827;
      border-radius: 10px;
      display: none;
    }

    .bar {
      width: 100%;
      background: #333;
      border-radius: 20px;
      overflow: hidden;
      margin-top: 10px;
    }

    .fill {
      height: 20px;
      width: 0%;
      background: #2563eb;
    }
  </style>
</head>

<body>

  <h1>Project Progress Tracker</h1>

  <input id="orderInput" placeholder="Enter Order ID (AS-1001)">
  <button onclick="checkProject()">Check Progress</button>

  <div class="box" id="resultBox">
    <h2 id="status"></h2>
    <p id="email"></p>
    <p id="package"></p>

    <div class="bar">
      <div class="fill" id="progressBar"></div>
    </div>
  </div>

  <script>
    async function checkProject() {
      const orderId = document.getElementById("orderInput").value;

      const res = await fetch("YOUR_SUPABASE_URL/rest/v1/projects?order_id=eq." + orderId, {
        headers: {
          apikey: "YOUR_ANON_KEY",
          Authorization: "Bearer YOUR_ANON_KEY"
        }
      });

      const data = await res.json();

      if (data.length === 0) {
        alert("No project found");
        return;
      }

      const project = data[0];

      document.getElementById("resultBox").style.display = "block";
      document.getElementById("status").innerText = "Status: " + project.status;
      document.getElementById("email").innerText = project.email;
      document.getElementById("package").innerText = project.package;

      document.getElementById("progressBar").style.width = project.progress + "%";
    }
  </script>

</body>
</html>
